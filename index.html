<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="rgb(250, 244, 232)">
  <title>Gustito a Salta · Carta</title>
  <meta name="description" content="Carta digital de Gustito a Salta — empanadas salteñas cortadas a cuchillo. Francisco N. de Laprida 212, Nueva Córdoba.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/encabezado.css">
  <link rel="stylesheet" href="./css/barra.css">
  <link rel="stylesheet" href="./css/carta.css">
  <link rel="stylesheet" href="./css/barra-pedido.css">
  <link rel="stylesheet" href="./css/hoja.css">
  <link rel="stylesheet" href="./css/entrega.css">
  <link rel="stylesheet" href="./css/pie.css">
  <link rel="stylesheet" href="./css/mantenimiento.css">
  <link rel="stylesheet" href="./css/nosotros.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
  <div class="app" id="app">

    <!-- ENCABEZADO -->
    <header class="hero">
      <nav class="nav">
        <a class="nav__link nav__link--active" href="./index.html">Carta</a>
        <a class="nav__link" href="./nosotros.html">Quiénes somos</a>
      </nav>

      <p class="hero__eyebrow">Empanadas salteñas</p>
      <h1 class="hero__title hero__title--logo"><img class="hero__logo" src="./img/logo-nombre.png" alt="Gustito a Salta" width="583" height="179"></h1>
      <p class="hero__tagline" data-negocio="tagline">Cortadas a cuchillo, como en Salta.</p>
      <div id="status" aria-live="polite"></div>
    </header>

    <div id="notice" aria-live="polite"></div>

    <!-- BUSCADOR + PESTAÑAS (pegados arriba al hacer scroll) -->
    <div class="bar">
      <div class="search">
        <svg class="search__icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.4" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.6" y2="16.6"></line>
        </svg>
        <input class="search__input" id="search" type="search" placeholder="Buscar en la carta…" autocomplete="off" aria-label="Buscar en la carta">
        <button class="search__clear" id="search-clear" type="button" data-act="clear-search" aria-label="Limpiar búsqueda" hidden>×</button>
      </div>
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>

    <!-- CARTA -->
    <main>
      <p class="loader" id="loader">Cargando la carta…</p>
      <div id="menu"></div>
    </main>

    <!-- PIE -->
    <footer class="footer">
      <div class="footer__block">
        <h2 class="footer__title">Horarios</h2>
        <div class="hours" id="hours"></div>
      </div>
      <div class="footer__block">
        <h2 class="footer__title">Dónde estamos</h2>
        <a class="footer__link" id="map-link" target="_blank" rel="noopener">
          <svg class="footer__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.3"></circle></svg><span class="footer__text">Dirección</span></a>
        <a class="footer__link" id="wa-link" target="_blank" rel="noopener">
          <svg class="footer__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.5l1.1-3.6A8 8 0 1 1 8.4 18.6z"></path><path d="M9.2 8.6c.2-.5.5-.6.8-.6h.5c.2 0 .4.1.5.4l.6 1.4c.1.2 0 .5-.1.6l-.5.6c.6 1.1 1.5 2 2.6 2.6l.6-.5c.2-.1.4-.2.6-.1l1.4.6c.3.1.4.3.4.5v.5c0 .3-.1.6-.6.8-.7.3-1.6.3-2.6-.2a8.6 8.6 0 0 1-4.1-4.1c-.5-1-.5-1.9-.1-2.4z"></path></svg><span class="footer__text">WhatsApp</span></a>
        <a class="footer__link" id="ig-link" target="_blank" rel="noopener">
          <svg class="footer__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4.2"></circle><circle cx="17.4" cy="6.6" r=".6" fill="currentColor"></circle></svg><span class="footer__text">Instagram</span></a>
      </div>
    </footer>

    <!-- PEDIDO -->
    <div class="cartbar" id="cartbar" hidden></div>
    <div class="sheet-overlay" id="sheet-overlay" hidden></div>
  </div>

  <script type="module" src="./src/app/main.js"></script>
</body>
</html>
